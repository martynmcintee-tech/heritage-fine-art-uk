<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Cancelled | Heritage Fine Art UK</title>
  <style>
    body {
      background: #fbf9f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      border-radius: 12px;
      border: 1px solid #e6e2da;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
    }
    .icon-circle {
      width: 64px;
      height: 64px;
      background: #f5ecea;
      color: #8c2d19;
      font-size: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.6rem;
      color: #1a1918;
      margin-bottom: 12px;
    }
    p {
      color: #66625d;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #1e3a2b;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #294e3a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-circle">✕</div>
    <h1>Checkout Not Completed</h1>
    <p>Your transaction was cancelled. No charges were made to your payment method. When you are ready, you can return to our curated collection and select your preferred print.</p>
    <a href="/" class="btn">Return to Collection</a>
  </div>
</body>
</html>
